<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-wallet text-lg"></i>
        </div>
        <h1 class="text-xl font-bold">Expense Tracker</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button id="themeToggleBtn" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300">
          <i class="fa-regular fa-moon dark:hidden"></i>
          <i class="fa-regular fa-sun hidden dark:inline"></i>
        </button>
        <button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-2 rounded-lg text-sm font-semibold flex items-center space-x-1">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>Add</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <span class="text-xs font-medium text-slate-400">Balance</span>
        <h3 id="statBalance" class="text-lg font-bold mt-1">₹0</h3>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <span class="text-xs font-medium text-slate-400">Income</span>
        <h3 id="statIncome" class="text-lg font-bold mt-1 text-emerald-600">₹0</h3>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <span class="text-xs font-medium text-slate-400">Expenses</span>
        <h3 id="statExpense" class="text-lg font-bold mt-1 text-rose-600">₹0</h3>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <span class="text-xs font-medium text-slate-400">Top Spend</span>
        <h3 id="statTopCategory" class="text-sm font-bold mt-1 truncate">None</h3>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col items-center">
      <h2 class="text-sm font-semibold w-full mb-2">Category Breakdown</h2>
      <div class="relative w-[220px] h-[220px]">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <h2 class="font-bold text-base">Transactions</h2>
        <select id="filterCategory" onchange="renderApp()" class="text-xs bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2 py-1.5 outline-none">
          <option value="ALL">All Categories</option>
          <option value="Shopping">Shopping</option>
          <option value="Travel">Travel</option>
          <option value="Cig & Alcohol">Cig & Alcohol</option>
          <option value="Investment">Investment</option>
          <option value="Grocery">Grocery</option>
          <option value="Fuel">Fuel</option>
          <option value="Food">Food</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Fitness">Fitness</option>
          <option value="Family">Family</option>
          <option value="Income">Salary / Income</option>
        </select>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <tbody id="transactionList" class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="txnModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-xl border border-slate-200 dark:border-slate-700">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-base font-bold">Add Transaction</h3>
        <button onclick="closeModal()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="txnForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="txnId">
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-700 rounded-lg">
          <button type="button" id="btnTypeExpense" onclick="setType('expense')" class="py-1.5 text-xs font-semibold rounded bg-white dark:bg-slate-800 shadow-sm text-rose-600">Expense</button>
          <button type="button" id="btnTypeIncome" onclick="setType('income')" class="py-1.5 text-xs font-semibold rounded text-slate-500">Income</button>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Amount (₹)</label>
          <input type="number" id="txnAmount" step="1" min="1" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-base font-bold outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Category</label>
          <select id="txnCategory" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-sm outline-none"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Description</label>
          <input type="text" id="txnDesc" placeholder="e.g. Petrol, Gym fees" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Date</label>
          <input type="date" id="txnDate" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-sm outline-none">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 text-xs text-slate-500">Cancel</button>
          <button type="submit" class="px-4 py-1.5 text-xs font-semibold text-white bg-brand-600 rounded-lg">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const EXPENSE_CATEGORIES = [
      { name: 'Shopping', icon: 'fa-bag-shopping', color: '#ec4899' },
      { name: 'Travel', icon: 'fa-plane-departure', color: '#06b6d4' },
      { name: 'Cig & Alcohol', icon: 'fa-wine-bottle', color: '#8b5cf6' },
      { name: 'Investment', icon: 'fa-arrow-trend-up', color: '#10b981' },
      { name: 'Grocery', icon: 'fa-basket-shopping', color: '#84cc16' },
      { name: 'Fuel', icon: 'fa-gas-pump', color: '#f97316' },
      { name: 'Food', icon: 'fa-utensils', color: '#ef4444' },
      { name: 'Entertainment', icon: 'fa-film', color: '#3b82f6' },
      { name: 'Fitness', icon: 'fa-dumbbell', color: '#14b8a6' },
      { name: 'Family', icon: 'fa-people-roof', color: '#f59e0b' }
    ];

    const INCOME_CATEGORIES = [
      { name: 'Salary', icon: 'fa-money-bill-wave', color: '#10b981' },
      { name: 'Other Income', icon: 'fa-wallet', color: '#6366f1' }
    ];

    let currentType = 'expense';
    let transactions = JSON.parse(localStorage.getItem('my_expenses')) || [
      { id: '1', type: 'expense', category: 'Food', amount: 480, desc: 'Dinner', date: '2026-10-18' },
      { id: '2', type: 'expense', category: 'Fuel', amount: 1500, desc: 'Petrol', date: '2026-10-17' },
      { id: '3', type: 'expense', category: 'Investment', amount: 10000, desc: 'SIP', date: '2026-10-15' },
      { id: '4', type: 'income', category: 'Salary', amount: 75000, desc: 'Monthly salary', date: '2026-10-01' }
    ];

    let categoryChartInstance = null;
    const formatINR = (amt) => '₹' + Number(amt).toLocaleString('en-IN');

    function saveAndSync() {
      localStorage.setItem('my_expenses', JSON.stringify(transactions));
      renderApp();
    }

    function setType(type) {
      currentType = type;
      const btnExp = document.getElementById('btnTypeExpense');
      const btnInc = document.getElementById('btnTypeIncome');
      const catSelect = document.getElementById('txnCategory');
      if (type === 'expense') {
        btnExp.className = "py-1.5 text-xs font-semibold rounded bg-white dark:bg-slate-800 shadow-sm text-rose-600";
        btnInc.className = "py-1.5 text-xs font-semibold rounded text-slate-500";
        catSelect.innerHTML = EXPENSE_CATEGORIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
      } else {
        btnInc.className = "py-1.5 text-xs font-semibold rounded bg-white dark:bg-slate-800 shadow-sm text-emerald-600";
        btnExp.className = "py-1.5 text-xs font-semibold rounded text-slate-500";
        catSelect.innerHTML = INCOME_CATEGORIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
      }
    }

    function openModal() {
      document.getElementById('txnModal').classList.remove('hidden');
      document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('txnForm').reset();
      setType('expense');
    }

    function closeModal() {
      document.getElementById('txnModal').classList.add('hidden');
    }

    function deleteTxn(id) {
      if (confirm('Delete transaction?')) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndSync();
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('txnAmount').value);
      const category = document.getElementById('txnCategory').value;
      const desc = document.getElementById('txnDesc').value || category;
      const date = document.getElementById('txnDate').value;

      transactions.unshift({ id: Date.now().toString(), type: currentType, category, amount, desc, date });
      closeModal();
      saveAndSync();
    }

    function renderApp() {
      const catFilter = document.getElementById('filterCategory').value;
      let filtered = transactions.filter(t => catFilter === 'ALL' || t.category === catFilter);

      const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
      const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

      document.getElementById('statIncome').innerText = formatINR(totalIncome);
      document.getElementById('statExpense').innerText = formatINR(totalExpense);
      document.getElementById('statBalance').innerText = formatINR(totalIncome - totalExpense);

      const expenseMap = {};
      transactions.filter(t => t.type === 'expense').forEach(t => {
        expenseMap[t.category] = (expenseMap[t.category] || 0) + t.amount;
      });
      const topCat = Object.entries(expenseMap).sort((a,b) => b[1] - a[1])[0];
      document.getElementById('statTopCategory').innerText = topCat ? topCat[0] : 'None';

      const listEl = document.getElementById('transactionList');
      if (filtered.length === 0) {
        listEl.innerHTML = `<tr><td class="p-4 text-center text-slate-400">No records found.</td></tr>`;
      } else {
        listEl.innerHTML = filtered.map(t => {
          const isExp = t.type === 'expense';
          return `
            <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/40">
              <td class="py-2.5 px-3">
                <div class="font-medium text-slate-900 dark:text-white">${t.category}</div>
                <div class="text-[11px] text-slate-400">${t.desc} • ${t.date}</div>
              </td>
              <td class="py-2.5 px-3 text-right font-bold ${isExp ? 'text-rose-600' : 'text-emerald-600'}">
                ${isExp ? '-' : '+'} ${formatINR(t.amount)}
              </td>
              <td class="py-2.5 px-3 text-right">
                <button onclick="deleteTxn('${t.id}')" class="text-slate-400 hover:text-rose-600 px-1"><i class="fa-regular fa-trash-can"></i></button>
              </td>
            </tr>
          `;
        }).join('');
      }

      renderChart(expenseMap);
    }

    function renderChart(expenseMap) {
      const labels = EXPENSE_CATEGORIES.map(c => c.name);
      const data = labels.map(c => expenseMap[c] || 0);
      const colors = EXPENSE_CATEGORIES.map(c => c.color);

      if (categoryChartInstance) categoryChartInstance.destroy();
      const ctx = document.getElementById('categoryChart').getContext('2d');
      categoryChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '70%' }
      });
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    renderApp();
  </script>
</body>
</html>
